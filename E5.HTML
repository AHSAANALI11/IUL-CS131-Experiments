<html>
<head>
    <title>Anchor Tag</title>
</head>
<body>

<h2>1. Link Opening in New Window</h2>
<a href="https://www.google.com" target="_blank">
    Open Google
</a>

<h2>2. Reference Within Same Document</h2>
<a href="#bottom">Go to Bottom</a>

<br><br><br><br><br><br><br>

<h2 id="bottom">Welcome to Bottom</h2>

<h2>3. Image as a Hyperlink</h2>
<a href="google.jpg">
    <img src="image1.png" width="200" height="200">
</a>

</body>
</html>
