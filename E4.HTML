<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Personal Data Form</h2>
    <form>
     <label for="Name">Name:</label>                      <input type="text"> <br>
     <label for="Password">Password:</label>              <input type="password"> <br>
     <label for="Email">Email:</label>                    <input type="email"> <br>

     <label for="City">City:</label>                      <select name="City" id="City"> 
                                                           <option value="Delhi">Delhi</option>
                                                           <option value="Mumbai">Mumbai</option>
                                                           <option value="Lucknow">Lucknow</option>
                                                         </select> <br>

     <label for="Gender">Gender:</label>                <input type="radio" name="Gender" value="Male">Male
                                                        <input type="radio" name="Gender" value="Female">Female
                                                        <input type="radio" name="Gender" value="Other">Other <br>

     <label for="Hobbies">Hobbies:</label>                      <input type="checkbox" name="Hobby" value="Reading">Reading 
                                                        <input type="checkbox" name="Hobby" value="Playing">Playing
                                                        <input type="checkbox" name="Hobby" value="Music">Music <br> <br>
    <input type="submit" value="submit">                                                    
    </form>
</body>
</html>
